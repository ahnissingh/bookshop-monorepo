spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookshop_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ahnis123
    driver-class-name: com.mysql.cj.jdbc.Driver
  threads:
    virtual:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG


cors:
  allowed-origins:
    - "http://localhost:5173"
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "*"

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 900000 # 15 minutes in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  cookie-domain: localhost
