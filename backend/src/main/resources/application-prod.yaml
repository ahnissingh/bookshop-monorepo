spring:
  #This is a fallback for amazon ses as it ses is yet for approval but works in sandbox that is allows only allowed emails to receive emails
  mail:
    host: smtp.sendgrid.net
    port: 465
    username: apikey
    password: ${SENDGRID_API_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  threads:
    virtual:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      #For now update will shift to validate once confirmed
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  cloud:
    aws:
      ses:
        enabled: false
      credentials:
        secret-key: ${AWS_SECRET_KEY}
        access-key: ${AWS_ACCESS_KEY}
      region:
        static: ${AWS_REGION:ap-south-1}
logging:
  level:
    root: INFO
    com.bookshop: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGINS}
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "*"

app:
  email:
    provider: ${EMAIL_PROVIDER:sendgrid}  #'ses' for aws ses and 'sendgrid' for sendgrid
  frontend:
    url: https://bookstacks.store
  aws:
    s3:
      bucket-name: "bookstacks-images"
    sqs:
      notification-queue-url: ${SQS_NOTIFICATION_QUEUE_URL}
    ses:
      from-email: "noreply@bookstacks.store"
  cookie:
    secure: true
    domain: ".bookstacks.store"
    same-site: "Lax"
    path: "/"
jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 900000 # 15 minutes in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
