name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ahnis/mybookshop
  ECR_REGISTRY: 907260787573.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Integration Tests
        working-directory: ./backend
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: ./mvnw clean test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image
        working-directory: ./backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to ECR on the EC2 instance
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 907260787573.dkr.ecr.ap-south-1.amazonaws.com
            
            # 2. Pull the latest image
            docker pull 907260787573.dkr.ecr.ap-south-1.amazonaws.com/ahnis/mybookshop:latest
            
            # 3. Stop and remove the old container if it exists
            docker stop mybookshop-backend || true
            docker rm mybookshop-backend || true
            
            # 4. Run the new container
                    docker run -d \
                    --name mybookshop-backend \
                    -p 8080:8080 \
                    -e SPRING_PROFILES_ACTIVE=prod \
                    -e SPRING_DATASOURCE_URL="jdbc:mysql://database-1.c7240iwoykau.ap-south-1.rds.amazonaws.com:3306/bookshop_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false" \
                    -e SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
                    -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                    -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
                    -e CORS_ALLOWED_ORIGINS="*" \
                    --restart unless-stopped \
                    907260787573.dkr.ecr.ap-south-1.amazonaws.com/ahnis/mybookshop:latest
